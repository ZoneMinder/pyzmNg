# Gates for every push and PR (AGENTS.md P2, P3; AGENTS.project.md).
# Make `gates`, `proven-red`, and `es-contract` required checks in branch
# protection; a check nobody requires is advice.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Tier-1 needs the ml and serve extras and streamlit (train tests import
  # it), not ultralytics. opencv-python-headless stands in for a system cv2.
  TEST_DEPS: pytest httpx opencv-python-headless streamlit>=1.41

jobs:
  # P1: the body quotes the issue's acceptance lines; a feat PR names its
  # spec; no PR edits CHANGELOG.md. Fork PRs and bots are exempt.
  pr-acceptance:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Title and body go through env, never into the script text: both are
      # attacker-controlled.
      - name: PR body has acceptance lines, a spec on a feat, no CHANGELOG.md edit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/gates/pr-body-check.sh

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The instruction gate checks that cited commit hashes exist.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[ml,serve]" $TEST_DEPS
      - name: make gate (Tier-1, instruction gate, ratchet)
        run: make gate

  proven-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[ml,serve]" $TEST_DEPS
      # P2 by machine: the tests this range changed must fail on the code the
      # range replaces. A push that creates a branch has no before commit.
      # The worktree runs the fork-point code because pytest's rootdir puts
      # it first on sys.path, ahead of the installed copy.
      - name: Changed tests go red on the pre-change code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning title=Proven red skipped::new branch push has no base commit"
            exit 0
          fi
          if [ -n "$PR_TITLE" ]; then
            sh scripts/gates/proven-red.sh "$BASE" "$HEAD" --title "$PR_TITLE"
          else
            sh scripts/gates/proven-red.sh "$BASE" "$HEAD"
          fi
      # Proves the existing tests of the risky modules can fail at all.
      - name: Mutation smoke
        run: make mutation

  # ES interface contract: ES's own test of the pyzm shape it reads, run
  # against this checkout. ZM_E2E_REQUIRE=1 makes it fail instead of skip
  # when pyzm cannot be imported.
  es-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZoneMinder/zmeventnotificationNg
          path: _es
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[ml]" pytest pyyaml opencv-python-headless
      - name: ES hook/tests/test_pyzm_contract.py against this pyzm
        env:
          ZM_E2E_REQUIRE: '1'
        run: cd _es/hook && PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest tests/test_pyzm_contract.py -v
